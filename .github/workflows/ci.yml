name: CI

# This repo checks out ONLY itself. The agent deliberately has no dependency on
# the DTP engines — it speaks the protocol over HTTP — so there are no sibling
# checkouts here and no ENGINES_READ_TOKEN to provision.
on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  # ON ALL THREE PLATFORMS, not only Linux. Several collectors exist ONLY on one
  # of them — the Windows certificate store is crypt32 syscalls, the macOS
  # keychain is a subprocess — and cross-compiling proves those files parse, not
  # that they work. Code that ships to a customer's servers having never once
  # been executed is code nobody has tested, and the first person to run it
  # would be them.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # DERIVED FROM go.mod, not pinned separately. A dependency bump can
          # raise the go directive — x/crypto 0.52.0 did exactly that — and a
          # literal version here would then be quietly wrong: setup-go installs
          # what it is told, the toolchain downloads what go.mod demands, and
          # the version this workflow claims to test on is not the one it uses.
          go-version-file: go.mod
          cache: true

      # Once is enough, and it is a Unix shell script.
      - name: Formatting
        if: matrix.os == 'ubuntu-latest'
        run: |
          unformatted="$(gofmt -l .)"
          [ -z "$unformatted" ] || { echo "::error::gofmt needed on:"; echo "$unformatted"; exit 1; }

      - run: go vet ./...

      # ./... INCLUDES ./e2e, which builds the binary and runs it end to end
      # against a protocol-faithful server on a host seeded with the awkward mix
      # — an expired certificate, a PKCS#12, a keytool keystore, a self-signed
      # CA:TRUE certificate, a directory of nothing but private keys.
      #
      # It is here because two releases in two days fixed bugs this suite could
      # not see: every collector test exercised ONE collector against ONE root,
      # and both bugs lived between "each collector works" and "they work
      # together on a real machine". Both were found by hand, after shipping.
      # Reinstating either now turns ./e2e red.
      #
      # It needs no Docker and no DTP: this repository cannot boot one, and the
      # server half is a test fixture that speaks the documented protocol.
      - run: go test -race ./...
        env:
          # The Windows runner is elevated, and the state directory's ownership
          # tests need it to be: here, a test that would skip for want of
          # elevation fails instead, so they cannot stop running unnoticed.
          DTP_REQUIRE_ELEVATED: ${{ matrix.os == 'windows-latest' && '1' || '' }}

  # The release path, exercised on every change rather than only when a tag is
  # pushed. A release pipeline whose first real run is the release itself is one
  # nobody has tested — and this one produces the artefacts that land on
  # customers' servers.
  release-path:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # DERIVED FROM go.mod, not pinned separately. A dependency bump can
          # raise the go directive — x/crypto 0.52.0 did exactly that — and a
          # literal version here would then be quietly wrong: setup-go installs
          # what it is told, the toolchain downloads what go.mod demands, and
          # the version this workflow claims to test on is not the one it uses.
          go-version-file: go.mod
          cache: true

      - name: Build every artefact
        run: script/build-release.sh 0.0.0-ci

      # The build is meant to be byte-stable so anyone can rebuild a published
      # tag and check the checksums themselves. That is worth nothing if it
      # quietly stops holding, and building twice is the only way to know.
      - name: Build is reproducible
        run: |
          cp dist/SHA256SUMS /tmp/first-pass.txt
          script/build-release.sh 0.0.0-ci >/dev/null
          diff -u /tmp/first-pass.txt dist/SHA256SUMS

      - name: Packages
        run: script/build-packages.sh 0.0.0-ci

      # The Windows installer, built on Linux with wixl. It is here rather than
      # only in the release workflow because it is the one artefact that cannot
      # be exercised where it is built — only Windows can install an MSI — so
      # everything that CAN be checked has to be checked at build time.
      #
      # build-msi.sh reads the package back and asserts the service is really
      # in it. wixl reports success for a document whose elements it declined to
      # act on, and an installer that lays down the binary and registers no
      # service installs cleanly, appears in Add/Remove Programs, and never
      # reports a certificate.
      - name: Windows installer
        run: script/build-msi.sh 0.0.0-ci

      # A SECOND VERSION, for the upgrade the Windows job runs. Every upgrade
      # runs the OLD package's StopTray before the new files land, so what this
      # release does there is what every later release inherits.
      - name: A later installer, to upgrade to
        run: script/build-msi.sh 0.0.1-ci

      # And one numbered above every real release, for the job that upgrades
      # FROM a real release. The installer refuses a lower version as a
      # downgrade (Bugbot caught 0.0.1 being used for it), so this is the only
      # number that job can upgrade to — whatever has been published by then.
      - name: An installer newer than any release
        run: script/build-msi.sh 999.0.0-ci

      # The installer's REFUSALS are the part worth testing. One that verifies
      # on the happy path and waves everything else through has the security
      # properties of one that does not verify at all.
      - name: Installer accepts what it should and refuses what it should not
        run: script/test-install.sh 0.0.0-ci

      # The .deb has to install on a machine that is not this runner, with the
      # state directory that holds the agent's private key at 0700.
      # The maintainer scripts' decision logic, with systemctl stubbed. Debian's
      # prerm and RPM's %preun BOTH run on upgrade as well as removal, so a
      # script that disables unconditionally stops an enrolled fleet reporting
      # on a routine `apt upgrade` — and nothing errors.
      - name: Maintainer scripts disable only on removal
        run: script/test-package-scripts.sh

      # The same question put to REAL dpkg, because the bug above was a wrong
      # belief about which arguments dpkg passes. Also checks the approved
      # keypair survives removal and the state directory lands at 0700.
      - name: Package survives an upgrade and keeps the agent's identity
        run: script/test-package-lifecycle.sh 0.0.0-ci

      # Handed to the Windows job below, which is the only place the installer
      # can actually be installed.
      - uses: actions/upload-artifact@v4
        with:
          name: dist-ci
          path: dist/
          retention-days: 1

  # THE INSTALLER, INSTALLED. Everything else about the MSI is read off the
  # package without running it, and reading a package is not the same as a
  # machine acting on it: the tables can be perfect and the service can still
  # fail to start, because a plain binary handed to the Service Control Manager
  # is killed after thirty seconds with "did not respond in a timely fashion".
  # That failure is invisible from Linux and invisible from a unit test, and it
  # is the single most likely way this ships broken.
  #
  # So the package built on ubuntu is installed on a real Windows machine, put
  # through start, stop and uninstall, and asked whether it kept the one thing
  # that must survive an uninstall.
  windows-install:
    needs: release-path
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-ci
          path: dist

      - name: Install
        shell: pwsh
        run: |
          $msi = (Resolve-Path dist\dtp-agent_0.0.0-ci_windows_amd64.msi).Path
          Write-Host "installing $msi"
          $p = Start-Process msiexec -ArgumentList "/i","`"$msi`"","/qn","/l*v","install.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) {
            Get-Content install.log -Tail 80
            throw "msiexec exited $($p.ExitCode)"
          }

      # The service must be RUNNING, not merely registered. A binary that does
      # not speak the service control protocol registers perfectly and then
      # gets killed on start, which is the whole reason the agent has a
      # `service` command rather than the installer pointing at `run`.
      - name: The service is registered and running
        shell: pwsh
        run: |
          $svc = Get-Service DTPAgent -ErrorAction Stop
          Write-Host "status: $($svc.Status), start type: $($svc.StartType)"
          if ($svc.Status -ne 'Running') { throw "the service is $($svc.Status), not Running" }
          if ($svc.StartType -ne 'Automatic') { throw "start type is $($svc.StartType); a reboot would stop this host reporting" }

      # An agent nobody has enrolled must WAIT, not fail. This is the state
      # every host is in between running the installer and someone typing
      # `enroll`, and a service that treated it as an error would crash-loop on
      # every machine in an estate during a rollout.
      - name: An unenrolled service waits, and says so where it can be read
        shell: pwsh
        run: |
          $log = "$env:ProgramData\DTP\agent\agent.log"
          for ($i = 0; $i -lt 30 -and -not (Test-Path $log); $i++) { Start-Sleep -Seconds 1 }
          if (-not (Test-Path $log)) { throw "the service wrote no log at $log" }
          $text = Get-Content $log -Raw
          Write-Host $text
          if ($text -notmatch 'not enrolled') { throw "the log does not say the agent is waiting to be enrolled" }
          if ($text -match 'scan failed')     { throw "an unenrolled agent reported a failure" }

      # `status` is what support asks for first, so it has to answer the
      # Windows question — is the service running — and not only the question
      # the Linux build could already answer.
      - name: status reports the service
        shell: pwsh
        run: |
          $exe = "$env:ProgramFiles\SSL.com\DTP Agent\dtp-agent.exe"
          $out = & $exe status | Out-String
          Write-Host $out
          if ($out -notmatch 'service\s+running') { throw "status does not report the service as running" }
          if ($out -notmatch 'enrolled\s+no')     { throw "status does not report that the agent is unenrolled" }

      # THE NOTIFICATION-AREA ICON, as installed: the file, the Start-menu
      # shortcut and the sign-in entry. Read back from the machine, not the
      # package, because the package can carry a row Windows declines to act on.
      - name: The icon is installed, in the Start menu, and starts at sign-in
        shell: pwsh
        run: |
          $dir = "$env:ProgramFiles\SSL.com\DTP Agent"
          if (-not (Test-Path "$dir\dtp-agent-tray.exe")) { throw "dtp-agent-tray.exe was not installed" }

          $lnk = "$env:ProgramData\Microsoft\Windows\Start Menu\Programs\DTP Agent.lnk"
          if (-not (Test-Path $lnk)) { throw "no Start-menu shortcut at $lnk" }
          $target = (New-Object -ComObject WScript.Shell).CreateShortcut($lnk).TargetPath
          Write-Host "shortcut -> $target"
          if ($target -ne "$dir\dtp-agent-tray.exe") { throw "the shortcut points at '$target'" }

          $run = (Get-ItemProperty 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Run').DTPAgentTray
          Write-Host "Run: $run"
          if ($run -notmatch [regex]::Escape("$dir\dtp-agent-tray.exe") -or $run -notmatch '--autostart') {
            throw "the sign-in entry is '$run'"
          }

      # THE PINWHEEL ON THE FILES, read back as Windows reads it: an icon in
      # each executable (which is also what the Start-menu shortcut shows) and
      # the version information in its Properties. A build that lost the .syso
      # would still produce working binaries with the generic icon, and nothing
      # else here would notice.
      - name: The installed files carry the pinwheel and their version
        shell: pwsh
        run: |
          Add-Type -Namespace W -Name Shell -MemberDefinition '[DllImport("shell32.dll", CharSet=CharSet.Unicode)] public static extern uint ExtractIconEx(string file, int index, IntPtr[] large, IntPtr[] small, uint n);'
          foreach ($exe in 'dtp-agent.exe', 'dtp-agent-tray.exe') {
            $path = "$env:ProgramFiles\SSL.com\DTP Agent\$exe"
            $icons = [W.Shell]::ExtractIconEx($path, -1, $null, $null, 0)
            $info = (Get-Item $path).VersionInfo
            Write-Host "${exe}: $icons icon(s); $($info.CompanyName) / $($info.ProductName) / $($info.FileVersion)"
            if ($icons -lt 1) { throw "$exe carries no icon" }
            if ($info.CompanyName -ne 'SSL.com') { throw "$exe carries no version information (CompanyName '$($info.CompanyName)')" }
          }

      # What the icon reads: published by the service, readable by Users, and
      # writable by none of them — inside a state directory that stays closed.
      - name: The service publishes a status any user can read and none can write
        shell: pwsh
        run: |
          $state = "$env:ProgramData\DTP\agent"
          $file = "$state\public\status.json"
          for ($i = 0; $i -lt 30 -and -not (Test-Path $file); $i++) { Start-Sleep -Seconds 1 }
          if (-not (Test-Path $file)) { throw "the service published no status at $file" }
          $st = Get-Content $file -Raw | ConvertFrom-Json
          Write-Host ($st | ConvertTo-Json)
          if ($st.phase -ne 'not_enrolled') { throw "phase is '$($st.phase)', want not_enrolled" }

          $users = (New-Object Security.Principal.SecurityIdentifier 'S-1-5-32-545').Translate([Security.Principal.NTAccount]).Value
          $writes = 'Write|Modify|FullControl|Delete|ChangePermissions|TakeOwnership'
          foreach ($path in @("$state\public", $file)) {
            $rules = (Get-Acl $path).Access | Where-Object { $_.IdentityReference.Value -eq $users }
            if (-not $rules) { throw "$users cannot read $path" }
            foreach ($r in $rules) {
              if ($r.FileSystemRights.ToString() -match $writes) { throw "$users holds $($r.FileSystemRights) on $path" }
            }
          }
          if ((Get-Acl $state).Access | Where-Object { $_.IdentityReference.Value -eq $users }) {
            throw "$users can read the directory holding the agent's private key"
          }

      # THE READ THE ICON EXISTS TO MAKE, made by someone who is not an
      # administrator. Everything above is the runner — an administrator —
      # looking at ACLs; this is a real standard user opening the file through
      # a directory they cannot list, which only works if "bypass traverse
      # checking" does what public.go says it does. The shipped binary does the
      # reading, through the code the icon uses.
      - name: A standard user's icon can read the status
        shell: pwsh
        run: |
          $password = "Tray-$([guid]::NewGuid().ToString('N').Substring(0, 16))!"
          $secure = ConvertTo-SecureString $password -AsPlainText -Force
          New-LocalUser -Name traytest -Password $secure -AccountNeverExpires | Out-Null
          # Kept for the upgrade and uninstall steps, which need an icon that is
          # NOT elevated: this runner is, and an elevated icon hands itself to
          # the desktop's own user and leaves. A throwaway account on a
          # throwaway machine.
          "TRAYTEST_PASSWORD=$password" | Out-File -FilePath $env:GITHUB_ENV -Append
          $work = 'C:\traytest'
          New-Item -ItemType Directory $work | Out-Null
          icacls $work /grant 'traytest:(OI)(CI)M' | Out-Null

          $tray = "$env:ProgramFiles\SSL.com\DTP Agent\dtp-agent-tray.exe"
          $cred = New-Object Management.Automation.PSCredential('traytest', $secure)
          $p = Start-Process $tray -ArgumentList '--print' -Credential $cred -WorkingDirectory $work `
                 -RedirectStandardOutput "$work\out.txt" -RedirectStandardError "$work\err.txt" -Wait -PassThru
          $out = Get-Content "$work\out.txt" -Raw
          Write-Host "as a standard user:`n$out"
          Get-Content "$work\err.txt" -Raw
          if ($out -notmatch 'not enrolled') { throw "a standard user's icon could not see that the agent is waiting to be enrolled" }
          if ($out -match 'Cannot read')     { throw "a standard user's icon cannot read the status" }

      # DOUBLE-CLICKED, THE AGENT HOLDS ITS WINDOW OPEN; RUN FROM A PROMPT, IT
      # DOES NOT. Start-Process without redirection goes through the shell, as
      # Explorer does, and gives the process a console of its own. Both halves
      # are asserted: a hold that also fired at a prompt would hang every
      # script that runs the agent.
      - name: Double-clicked, the agent explains itself instead of vanishing
        shell: pwsh
        run: |
          $exe = "$env:ProgramFiles\SSL.com\DTP Agent\dtp-agent.exe"
          $p = Start-Process $exe -PassThru
          Start-Sleep -Seconds 3
          if ($p.HasExited) { throw "started on its own console, the agent exited (code $($p.ExitCode)) and took the window with it" }
          Stop-Process -Id $p.Id

          $sw = [Diagnostics.Stopwatch]::StartNew()
          & $exe 2>&1 | Out-Null
          if ($LASTEXITCODE -ne 2) { throw "from a prompt, no arguments exited $LASTEXITCODE, want 2" }
          if ($sw.Elapsed.TotalSeconds -gt 10) { throw "from a prompt the agent waited for a key press" }
          $global:LASTEXITCODE = 0

          # The other half, and the one that hangs a schedule if it breaks: a
          # command a scheduled task would run, given a console of its own just
          # as the double-click above was, must finish without anyone there.
          foreach ($cmd in @('version', 'run --once')) {
            $q = Start-Process $exe -ArgumentList $cmd -PassThru
            if (-not $q.WaitForExit(30000)) {
              Stop-Process -Id $q.Id
              throw "'dtp-agent $cmd' on a console of its own waited for a key press; a scheduled task running it would never end"
            }
          }

      # Stopping must be prompt. The Service Control Manager kills a service
      # that stops answering while it shuts down, and what the administrator
      # sees is an error about the agent rather than a scan closing its
      # connections.
      - name: The service stops when it is told to
        shell: pwsh
        run: |
          $sw = [Diagnostics.Stopwatch]::StartNew()
          Stop-Service DTPAgent -ErrorAction Stop
          (Get-Service DTPAgent).WaitForStatus('Stopped', '00:00:30')
          Write-Host "stopped in $($sw.Elapsed.TotalSeconds)s"

      # THE LINE IN THE README, RUN IN THE SHELL THE README NAMES.
      #
      # A documented command is a thing members copy, and this one is shell
      # dependent in a way that is invisible from Linux: PowerShell parses a
      # statement beginning with a quoted string as a string EXPRESSION, so the
      # obvious spelling — path in quotes, arguments after it — never starts the
      # agent. It fails with "Unexpected token 'enroll'", which reads as a
      # broken download rather than as a shell rule.
      #
      # Both forms are run here, and BOTH assertions matter: the documented one
      # has to work, and the one it replaced has to still be broken. Without the
      # second, this step would go on passing if PowerShell ever stopped caring
      # and the README's explanation quietly became folklore.
      - name: The documented enrollment line runs in PowerShell
        shell: pwsh
        run: |
          $exe = "$env:ProgramFiles\SSL.com\DTP Agent\dtp-agent.exe"
          $args = 'enroll --server http://127.0.0.1:1 --account 00000000-0000-0000-0000-000000000000'

          $documented = pwsh -NoProfile -Command "& `"$exe`" $args" 2>&1 | Out-String
          Write-Host "documented form:`n$documented"
          if ($documented -match 'Unexpected token') {
            throw "the form the README documents does not parse in PowerShell"
          }
          # It cannot reach a server on port 1, so the agent's OWN error is the
          # proof it ran at all rather than being parsed as a string.
          if ($documented -notmatch 'registering with') {
            throw "the documented form did not reach the agent"
          }

          $naive = pwsh -NoProfile -Command "`"$exe`" $args" 2>&1 | Out-String
          Write-Host "form without the call operator:`n$naive"
          if ($naive -notmatch 'Unexpected token') {
            throw "the quoted-path form now works, so the README's explanation of why it does not is wrong"
          }

          $global:LASTEXITCODE = 0

      # AN UPGRADE WITH THE ICON RUNNING. The old package's StopTray has to end
      # it and wait, or the file is in use and the upgrade only completes at a
      # reboot — exit 3010, a failure here.
      - name: Upgrading replaces a running icon and keeps the service
        shell: pwsh
        run: |
          # A standard user's icon, as on a real machine: this runner is
          # elevated, and an elevated icon hands itself off and exits.
          $cred = New-Object Management.Automation.PSCredential('traytest', (ConvertTo-SecureString $env:TRAYTEST_PASSWORD -AsPlainText -Force))
          $tray = Start-Process "$env:ProgramFiles\SSL.com\DTP Agent\dtp-agent-tray.exe" -Credential $cred -WorkingDirectory 'C:\traytest' -PassThru
          Start-Sleep -Seconds 3
          if ($tray.HasExited) {
            $mine = (Get-Process -Id $PID).SessionId
            throw "the standard user's icon exited by itself (code $($tray.ExitCode), runner session $mine), so this cannot show it is stopped"
          }
          Write-Host "a standard user's icon is running: pid $($tray.Id), session $((Get-Process -Id $tray.Id).SessionId)"

          $msi = (Resolve-Path dist\dtp-agent_0.0.1-ci_windows_amd64.msi).Path
          $p = Start-Process msiexec -ArgumentList "/i","`"$msi`"","/qn","/l*v","upgrade.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) {
            Get-Content upgrade.log -Tail 80
            throw "the upgrade exited $($p.ExitCode)"
          }
          if (Get-Process -Id $tray.Id -ErrorAction SilentlyContinue) { throw "the old icon outlived the upgrade" }
          $products = Get-ItemProperty 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*' |
            Where-Object { $_.DisplayName -eq 'DTP Certificate Discovery Agent' }
          if (@($products).Count -ne 1) { throw "$(@($products).Count) entries in Add/Remove Programs after an upgrade, want 1" }
          if ($products.DisplayVersion -ne '0.0.1') { throw "installed version is $($products.DisplayVersion) after the upgrade" }
          (Get-Service DTPAgent).WaitForStatus('Running', '00:00:30')
          Write-Host "upgraded to $($products.DisplayVersion); old icon stopped; service running"

      # The property an uninstall must not break. The state directory holds the
      # keypair DTP has already approved, so removing it would silently turn
      # every reinstall in an estate into a fresh round of approvals. `enroll`
      # against a dead address fails, and creates the key on its way there —
      # which is exactly the state a half-configured host is in.
      - name: Uninstalling keeps the agent's identity
        shell: pwsh
        run: |
          $exe = "$env:ProgramFiles\SSL.com\DTP Agent\dtp-agent.exe"
          & $exe enroll --server http://127.0.0.1:1 --account 00000000-0000-0000-0000-000000000000 2>&1 | Out-Null
          # THAT ENROL IS SUPPOSED TO FAIL — there is nothing on port 1. What
          # matters is that it wrote the keypair on its way there. Clearing
          # $LASTEXITCODE is not cosmetic: the pwsh wrapper exits the whole step
          # with whatever the last native command left behind, so an expected
          # refusal fails a step whose every assertion passed.
          $global:LASTEXITCODE = 0
          $key = "$env:ProgramData\DTP\agent\agent.key"
          if (-not (Test-Path $key)) { throw "enroll left no keypair to protect" }

          # An icon running while the package is removed: the installer has to
          # stop it, or the file is in use and removal finishes only at a
          # reboot — exit 3010, which the check below treats as a failure.
          # A standard user's icon, as on a real machine: this runner is
          # elevated, and an elevated icon hands itself off and exits.
          $cred = New-Object Management.Automation.PSCredential('traytest', (ConvertTo-SecureString $env:TRAYTEST_PASSWORD -AsPlainText -Force))
          $tray = Start-Process "$env:ProgramFiles\SSL.com\DTP Agent\dtp-agent-tray.exe" -Credential $cred -WorkingDirectory 'C:\traytest' -PassThru
          Start-Sleep -Seconds 3
          if ($tray.HasExited) {
            $mine = (Get-Process -Id $PID).SessionId
            throw "the standard user's icon exited by itself (code $($tray.ExitCode), runner session $mine), so this cannot show it is stopped"
          }
          Write-Host "a standard user's icon is running: pid $($tray.Id), session $((Get-Process -Id $tray.Id).SessionId)"

          $msi = (Resolve-Path dist\dtp-agent_0.0.1-ci_windows_amd64.msi).Path
          $p = Start-Process msiexec -ArgumentList "/x","`"$msi`"","/qn","/l*v","uninstall.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) {
            Get-Content uninstall.log -Tail 80
            throw "uninstall exited $($p.ExitCode)"
          }

          if (Get-Service DTPAgent -ErrorAction SilentlyContinue) { throw "the service outlived the uninstall" }
          if (-not (Test-Path $key)) { throw "uninstalling deleted the agent's keypair" }
          if (Get-Process -Id $tray.Id -ErrorAction SilentlyContinue) { throw "the icon outlived the uninstall" }
          if (Test-Path "$env:ProgramFiles\SSL.com\DTP Agent\dtp-agent-tray.exe") { throw "the icon's file outlived the uninstall" }
          if (Test-Path "$env:ProgramData\Microsoft\Windows\Start Menu\Programs\DTP Agent.lnk") { throw "the Start-menu shortcut outlived the uninstall" }
          if ((Get-ItemProperty 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Run').DTPAgentTray) { throw "the sign-in entry outlived the uninstall" }
          Write-Host "service, icon, shortcut and sign-in entry gone; keypair kept"

  # THE UPGRADE EVERY EXISTING WINDOWS AGENT WILL TAKE: from the published
  # v0.3.0, enrolled from an administrator prompt, to this build.
  #
  # This build judges the key and configuration by their OWNER before believing
  # them. On this runner an elevated administrator's files belong to the
  # Administrators group (measured), but where policy makes the creator the
  # owner, or wherever v0.3 was enrolled from an unelevated prompt, they belong
  # to the administrator's own account — and a version that knew only the group
  # would call those keys planted and stop the agents reporting at the upgrade.
  # Found by Bugbot, invisible to every other test here, because all of them
  # create their files with the new code. The job sets that ownership itself,
  # because this runner's policy would not produce it.
  windows-upgrade-from-release:
    needs: release-path
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-ci
          path: dist

      - name: Install the published v0.3.0
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.3.0 --repo $env:GITHUB_REPOSITORY --pattern '*windows_amd64.msi' --dir old
          $msi = (Get-ChildItem old\*.msi)[0].FullName
          $p = Start-Process msiexec -ArgumentList "/i","`"$msi`"","/qn","/l*v","old.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content old.log -Tail 60; throw "installing v0.3.0 exited $($p.ExitCode)" }

      # Enrolled the way the README says: from an elevated prompt. The server is
      # unreachable, so enroll writes the key and stops; the configuration it
      # would have saved is written here instead, from the same prompt, so both
      # files are owned the way a real enrollment leaves them.
      - name: Enroll it as an administrator would
        shell: pwsh
        run: |
          $exe = "$env:ProgramFiles\SSL.com\DTP Agent\dtp-agent.exe"
          & $exe enroll --server http://127.0.0.1:1 --account 00000000-0000-0000-0000-000000000000 2>&1 | Out-Null
          $global:LASTEXITCODE = 0
          $state = "$env:ProgramData\DTP\agent"
          '{"server_url":"https://dtp.example.com","account_id":"00000000-0000-0000-0000-000000000000"}' |
            Set-Content -NoNewline "$state\config.json"

          # Owned by the administrator's own account, as "Object creator"
          # policy or an unelevated v0.3 enrollment leaves them. This runner's
          # policy gives them to the group, so it is set here — and then
          # checked, because if they were the group's this job would pass
          # whatever the new code did with an administrator's files.
          $me = [Security.Principal.WindowsIdentity]::GetCurrent().Name
          foreach ($path in @($state, "$state\agent.key", "$state\config.json")) {
            icacls $path /setowner $me | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "could not make $me the owner of $path" }
          }
          $global:LASTEXITCODE = 0
          foreach ($f in 'agent.key', 'config.json') {
            $owner = (Get-Acl "$state\$f").Owner
            Write-Host "$f owned by $owner"
            if ($owner -ne $me) { throw "$f is owned by $owner, not by the administrator ($me) who wrote it — the case this job exists for is not set up" }
          }
          & $exe status | Out-File before.txt
          Get-Content before.txt

      - name: Upgrade to this build, and the agent keeps its identity
        shell: pwsh
        run: |
          $msi = (Resolve-Path dist\dtp-agent_999.0.0-ci_windows_amd64.msi).Path
          $p = Start-Process msiexec -ArgumentList "/i","`"$msi`"","/qn","/l*v","upgrade.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content upgrade.log -Tail 80; throw "the upgrade exited $($p.ExitCode)" }

          $exe = "$env:ProgramFiles\SSL.com\DTP Agent\dtp-agent.exe"
          $out = & $exe status 2>&1 | Out-String
          Write-Host $out
          if ($out -match 'planted') { throw "after the upgrade, the key an administrator enrolled is refused as planted" }
          $before = (Select-String -Path before.txt -Pattern '^key\s+(\S+)').Matches.Groups[1].Value
          if (-not $before) { throw "v0.3.0 reported no key before the upgrade, so this proves nothing" }
          if ($out -notmatch "key\s+$before") { throw "the key after the upgrade is not the key from before it ($before)" }
          if ($out -notmatch 'server\s+https://dtp.example.com') { throw "the configuration was not read after the upgrade" }
          Write-Host "same key ($($before.Substring(0,16))…) and configuration after the upgrade"

  # The agent ships as one static binary per platform, and a member's host is
  # not this runner. Cross-compiling every target on every change is what stops
  # a Unix-only syscall reaching main and breaking the Windows build at release
  # time instead of here.
  cross-compile:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: darwin,  goarch: amd64 }
          - { goos: darwin,  goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # DERIVED FROM go.mod, not pinned separately. A dependency bump can
          # raise the go directive — x/crypto 0.52.0 did exactly that — and a
          # literal version here would then be quietly wrong: setup-go installs
          # what it is told, the toolchain downloads what go.mod demands, and
          # the version this workflow claims to test on is not the one it uses.
          go-version-file: go.mod
          cache: true
      - name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          # No cgo: a binary that links the host's libc is not the single
          # portable artefact this is supposed to be, and it would pick up a
          # glibc version requirement from whatever built it.
          CGO_ENABLED: '0'
        # ./... so the notification-area icon is built for every target too:
        # it is Windows code behind a build tag, and a stub everywhere else.
        run: go build -ldflags "-s -w" ./...
